name: tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out current commit
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      # - name: Set up pandoc
      #   uses: r-lib/actions/setup-pandoc@v2
      #   with:
      #     pandoc-version: "2.18"

      - name: Set up python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox coverage

      - name: Test with coverage
        env:
          # Use the reviewed API revision until its Django 5.2 release is published.
          OBAPI_TEST_SOURCE: "django-overcomingbias-api @ git+https://github.com/chris-mcdo/django-overcomingbias-api.git@68b5a5f592836f9b42330e482333f5a12cb0c21d"
        run: "tox -e py313-coverage"

      - name: Generate coverage report
        run: python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          files: ./coverage.xml
          verbose: true
